name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Fix invalid JSX characters
        run: |
          find . -name "*.tsx" -not -path "*/node_modules/*" | xargs sed -i \
            -e 's/>>>/\&gt;\&gt;\&gt;/g' \
            -e 's/>>/\&gt;\&gt;/g' \
            -e 's/Recall > /Recall \&gt; /g' \
            -e 's/Rate > /Rate \&gt; /g' \
            -e 's/> [0-9]/\&gt; /g' \
            -e 's/ > / \&gt; /g'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
